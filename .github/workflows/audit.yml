name: Dependency audit
 
on:
  schedule:
    - cron: '0 17 * * 1' # every Monday
  workflow_dispatch: 
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high