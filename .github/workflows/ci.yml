name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: npm audit --audit-level=high
      #:  todo: uncomment once Jest + Supertest are set up
      #  (current "test" script exits 1 on purpose, so it's off for now)
      # - run: npm test
